<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ff6b9d" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ff6b9d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Center pulsing glow (estático) -->
  <circle cx="100" cy="100" r="75" fill="url(#centerGlow)" />

  <!-- ==================== CENTER CONTENT ==================== -->
  <g>
    <!-- Ring around the icon (pulsante) -->
    <circle cx="100" cy="100" r="48" fill="none" stroke="#ff6b9d" stroke-width="1.8" opacity="0.85">
      <animate attributeName="r" values="46;52;46" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Teddy bear icon - MAIOR -->
    <text x="100" y="100" font-family="serif" font-size="90" text-anchor="middle" dominant-baseline="central">🧸</text>
    
    <!-- "DB Analysis" text -->
    <text x="100" y="165" font-family="monospace" font-size="17" fill="#ff6b9d" text-anchor="middle" font-weight="bold" letter-spacing="1.5">
      DB Analysis
    </text>
  </g>
</svg>
